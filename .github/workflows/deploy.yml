name: Build and Deploy API to EKS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4

    - name: ☕ Setup Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: 🔨 Build JAR (Maven)
      run: mvn clean package -DskipTests

    - name: 🔐 Configurar AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: 🔑 Login no Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: 🐳 Build e Push imagem Docker para ECR
      run: |
        docker build -t spring-security .
        docker tag spring-security:latest 168377602722.dkr.ecr.us-east-1.amazonaws.com/spring-security:latest
        docker push 168377602722.dkr.ecr.us-east-1.amazonaws.com/spring-security:latest
        echo "✅ Imagem enviada para ECR!"

    - name: ☸️ Configurar kubectl para EKS
      run: |
        aws eks update-kubeconfig --region us-east-1 --name order-app-cluster

    - name: 🚀 Deploy no EKS
      run: |
        kubectl apply -f kubernete/deployment.yaml
        kubectl rollout restart deployment/spring-api-deployment
        kubectl rollout status deployment/spring-api-deployment --timeout=300s
        echo "✅ Deploy concluído!"

    - name: 🔍 Verificar pods
      run: |
        kubectl get pods
        echo ""
        echo "✅ API deployada com sucesso!"