name: Build and Deploy API to EKS

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Permite rodar manualmente pelo GitHub

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # ============================================================
    # 1. CHECKOUT DO CÓDIGO
    # ============================================================
    - name: 📥 Checkout código
      uses: actions/checkout@v4

    # ============================================================
    # 2. SETUP JAVA 21
    # ============================================================
    - name: ☕ Setup Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    # ============================================================
    # 3. BUILD DO JAR
    # ============================================================
    - name: 🔨 Build JAR (Maven)
      run: mvn clean package -DskipTests

    # ============================================================
    # 4. CONFIGURAR AWS
    # ============================================================
    - name: 🔐 Configurar AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    # ============================================================
    # 5. LOGIN NO ECR
    # ============================================================
    - name: 🔑 Login no Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # ============================================================
    # 6. BUILD E PUSH DOCKER
    # ============================================================
    - name: 🐳 Build e Push imagem Docker para ECR
      run: |
        docker build -t spring-security .
        docker tag spring-security:latest 168377602722.dkr.ecr.us-east-1.amazonaws.com/spring-security:latest
        docker push 168377602722.dkr.ecr.us-east-1.amazonaws.com/spring-security:latest
        echo "✅ Imagem enviada para ECR!"

    # ============================================================
    # 7. CONFIGURAR KUBECTL
    # ============================================================
    - name: ☸️ Configurar kubectl para EKS
      run: |
        aws eks update-kubeconfig --region us-east-1 --name order-app-cluster

    # ============================================================
    # 8. DEPLOY NO EKS
    # ============================================================
    - name: 🚀 Deploy no EKS
      run: |
        kubectl rollout restart deployment/spring-api-deployment
        kubectl rollout status deployment/spring-api-deployment --timeout=300s
        echo "✅ Deploy concluído!"

    # ============================================================
    # 9. VERIFICAR PODS
    # ============================================================
    - name: 🔍 Verificar pods
      run: |
        kubectl get pods
        echo ""
        echo "✅ API deployada com sucesso!"
